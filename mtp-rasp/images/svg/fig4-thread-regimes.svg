<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .ttl { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .ax  { font-size: 11px; fill: #64748b; }
    .lbl { font-size: 12px; fill: #334155; }
    .cap { font-size: 11.5px; fill: #475569; }
    .an  { font-size: 11px; font-weight: 600; }
  </style>

  <text x="16" y="26" class="ttl">Threads help at batch 4. They stop helping at batch 1.</text>
  <text x="16" y="46" class="cap">Throughput relative to 2 threads. Same board, same models, same afternoon.</text>

  <!-- LEFT: batch 1 -->
  <g transform="translate(70, 82)">
    <text x="0" y="-6" class="lbl" font-weight="600">Batch 1 — plain decode</text>
    <line x1="0" y1="220" x2="270" y2="220" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- y: 0.6 .. 1.5 over 220px ; y(v) = 220 - (v-0.6)*244 -->
    <g class="ax">
      <line x1="-4" y1="220" x2="0" y2="220" stroke="#94a3b8"/><text x="-8" y="224" text-anchor="end">0.6×</text>
      <line x1="-4" y1="122" x2="0" y2="122" stroke="#94a3b8"/><text x="-8" y="126" text-anchor="end">1.0×</text>
      <line x1="-4" y1="25"  x2="0" y2="25"  stroke="#94a3b8"/><text x="-8" y="29"  text-anchor="end">1.4×</text>
    </g>
    <line x1="0" y1="122" x2="270" y2="122" stroke="#cbd5e1" stroke-dasharray="4 3"/>

    <!-- x: threads 1..4 at 45,120,195,255 -->
    <g class="ax" text-anchor="middle">
      <text x="40"  y="240">1</text><text x="115" y="240">2</text>
      <text x="190" y="240">3</text><text x="255" y="240">4</text>
      <text x="140" y="260">threads</text>
    </g>

    <!-- Gemma batch1: 8.62 9.21 8.90 8.55  -> /9.21 = 0.936 1.000 0.966 0.928 -->
    <polyline points="40,204 115,122 190,146 255,166" fill="none" stroke="#2563eb" stroke-width="2.4"/>
    <circle cx="40" cy="204" r="4.5" fill="#2563eb"/><circle cx="115" cy="122" r="5.5" fill="#2563eb"/>
    <circle cx="190" cy="146" r="4.5" fill="#2563eb"/><circle cx="255" cy="166" r="4.5" fill="#2563eb"/>

    <!-- Qwen batch1: 2.27 3.39 3.40 3.24 -> /3.39 = 0.670 1.000 1.003 0.956 -->
    <polyline points="40,203 115,122 190,121 255,133" fill="none" stroke="#db2777" stroke-width="2.4" stroke-dasharray="6 3"/>
    <circle cx="40" cy="203" r="4.5" fill="#db2777"/><circle cx="115" cy="122" r="5.5" fill="#db2777"/>
    <circle cx="190" cy="121" r="4.5" fill="#db2777"/><circle cx="255" cy="133" r="4.5" fill="#db2777"/>

    <text x="150" y="90" class="an" fill="#475569">flat, then down</text>
    <text x="150" y="105" class="ax">the memory bus is already full</text>
  </g>

  <!-- RIGHT: batch 4 -->
  <g transform="translate(490, 82)">
    <text x="0" y="-6" class="lbl" font-weight="600">Batch 4 — MTP verify pass</text>
    <line x1="0" y1="220" x2="270" y2="220" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="220" stroke="#94a3b8" stroke-width="1.2"/>

    <g class="ax">
      <line x1="-4" y1="220" x2="0" y2="220" stroke="#94a3b8"/><text x="-8" y="224" text-anchor="end">0.6×</text>
      <line x1="-4" y1="122" x2="0" y2="122" stroke="#94a3b8"/><text x="-8" y="126" text-anchor="end">1.0×</text>
      <line x1="-4" y1="25"  x2="0" y2="25"  stroke="#94a3b8"/><text x="-8" y="29"  text-anchor="end">1.4×</text>
    </g>
    <line x1="0" y1="122" x2="270" y2="122" stroke="#cbd5e1" stroke-dasharray="4 3"/>

    <g class="ax" text-anchor="middle">
      <text x="40"  y="240">1</text><text x="115" y="240">2</text>
      <text x="190" y="240">3</text><text x="255" y="240">4</text>
      <text x="140" y="260">threads</text>
    </g>

    <!-- Gemma batch4: 15.84 27.78 31.93 31.05 -> /27.78 = 0.570 1.000 1.149 1.118 -->
    <polyline points="40,227 115,122 190,86 255,93" fill="none" stroke="#2563eb" stroke-width="2.4"/>
    <circle cx="40" cy="227" r="4.5" fill="#2563eb"/><circle cx="115" cy="122" r="4.5" fill="#2563eb"/>
    <circle cx="190" cy="86" r="5.5" fill="#2563eb"/><circle cx="255" cy="93" r="4.5" fill="#2563eb"/>

    <!-- Qwen batch4: 4.84 8.64 10.90 11.78 -> /8.64 = 0.560 1.000 1.262 1.363 -->
    <polyline points="40,229 115,122 190,58 255,34" fill="none" stroke="#db2777" stroke-width="2.4" stroke-dasharray="6 3"/>
    <circle cx="40" cy="229" r="4.5" fill="#db2777"/><circle cx="115" cy="122" r="4.5" fill="#db2777"/>
    <circle cx="190" cy="58" r="4.5" fill="#db2777"/><circle cx="255" cy="34" r="5.5" fill="#db2777"/>

    <text x="140" y="192" class="an" fill="#475569">keeps climbing</text>
    <text x="140" y="207" class="ax">there is arithmetic to parallelise</text>
  </g>

  <!-- legend -->
  <g transform="translate(300, 348)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#2563eb" stroke-width="2.4"/>
    <circle cx="13" cy="0" r="4" fill="#2563eb"/>
    <text x="34" y="4" class="cap">Gemma 4 E2B</text>
    <line x1="150" y1="0" x2="176" y2="0" stroke="#db2777" stroke-width="2.4" stroke-dasharray="6 3"/>
    <circle cx="163" cy="0" r="4" fill="#db2777"/>
    <text x="184" y="4" class="cap">Qwen3.5 4B</text>
  </g>
  <text x="430" y="382" class="cap" text-anchor="middle">Large dot marks each model's optimum. Where it lands depends on how much of the pass is arithmetic — so measure it.</text>
</svg>
