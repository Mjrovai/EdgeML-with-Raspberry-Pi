<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <style>
    .ttl { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .ax  { font-size: 11px; fill: #64748b; }
    .lbl { font-size: 12px; fill: #334155; }
    .cap { font-size: 11.5px; fill: #475569; }
    .an  { font-size: 11px; font-weight: 600; }
  </style>

  <text x="16" y="26" class="ttl">Cost of one forward pass, by how many tokens it carries</text>
  <text x="16" y="46" class="cap">Both models step at multiples of 4 — that is the CPU matrix kernel, not the architecture. Only Qwen penalises the leftovers.</text>

  <!-- ===== LEFT: Gemma ===== -->
  <g transform="translate(60, 80)">
    <text x="0" y="-8" class="lbl" font-weight="600" fill="#2563eb">Gemma 4 E2B — 3 threads</text>

    <!-- block shading -->
    <rect x="0" y="0" width="140" height="250" fill="#f8fafc"/>
    <rect x="140" y="0" width="140" height="250" fill="#f1f5f9"/>
    <text x="70" y="16" class="ax" text-anchor="middle">block 1</text>
    <text x="210" y="16" class="ax" text-anchor="middle">block 2</text>

    <!-- axes -->
    <line x1="0" y1="250" x2="290" y2="250" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- y ticks: 0..250ms over 250px -> 1ms = 0.9px, max 250 -->
    <g class="ax">
      <line x1="-4" y1="250" x2="0" y2="250" stroke="#94a3b8"/><text x="-8" y="254" text-anchor="end">0</text>
      <line x1="-4" y1="160" x2="0" y2="160" stroke="#94a3b8"/><text x="-8" y="164" text-anchor="end">100</text>
      <line x1="-4" y1="70"  x2="0" y2="70"  stroke="#94a3b8"/><text x="-8" y="74"  text-anchor="end">200</text>
    </g>
    <text x="-40" y="125" class="ax" text-anchor="middle" transform="rotate(-90 -40 125)">ms per pass</text>

    <!-- bars: x = 35*(N-1)+8, w=20 ; y = 250 - t*0.9 -->
    <!-- 114.2 114.4 117.5 125.7 195.6 197.3 201.1 202.3 -->
    <rect x="8"   y="147.2" width="20" height="102.8" rx="2" fill="#93c5fd"/>
    <rect x="43"  y="147.0" width="20" height="103.0" rx="2" fill="#93c5fd"/>
    <rect x="78"  y="144.3" width="20" height="105.7" rx="2" fill="#93c5fd"/>
    <rect x="113" y="136.9" width="20" height="113.1" rx="2" fill="#2563eb"/>
    <rect x="148" y="73.9"  width="20" height="176.1" rx="2" fill="#93c5fd"/>
    <rect x="183" y="72.4"  width="20" height="177.6" rx="2" fill="#93c5fd"/>
    <rect x="218" y="69.0"  width="20" height="181.0" rx="2" fill="#93c5fd"/>
    <rect x="253" y="67.9"  width="20" height="182.1" rx="2" fill="#93c5fd"/>

    <!-- x labels -->
    <g class="ax" text-anchor="middle">
      <text x="18"  y="266">1</text><text x="53"  y="266">2</text>
      <text x="88"  y="266">3</text><text x="123" y="266">4</text>
      <text x="158" y="266">5</text><text x="193" y="266">6</text>
      <text x="228" y="266">7</text><text x="263" y="266">8</text>
    </g>
    <text x="145" y="286" class="ax" text-anchor="middle">tokens in the pass</text>

    <!-- step annotation -->
    <line x1="123" y1="130" x2="158" y2="68" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="3 2"/>
    <text x="175" y="52" class="an" fill="#b45309">+70 ms step</text>
    <text x="175" y="66" class="ax">crossing into block 2</text>

    <text x="8" y="310" class="cap">Flat inside a block: token 2 is</text>
    <text x="8" y="326" class="cap">essentially <tspan font-weight="600">free</tspan> (114.2 → 114.4 ms).</text>
  </g>

  <!-- ===== RIGHT: Qwen ===== -->
  <g transform="translate(490, 80)">
    <text x="0" y="-8" class="lbl" font-weight="600" fill="#db2777">Qwen3.5 4B — 2 threads</text>

    <rect x="0" y="0" width="140" height="250" fill="#f8fafc"/>
    <rect x="140" y="0" width="140" height="250" fill="#f1f5f9"/>
    <text x="70" y="16" class="ax" text-anchor="middle">block 1</text>
    <text x="210" y="16" class="ax" text-anchor="middle">block 2</text>

    <line x1="0" y1="250" x2="290" y2="250" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="0" y1="0" x2="0" y2="250" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- y scale: 1000 ms over 250px -> 0.25 px/ms -->
    <g class="ax">
      <line x1="-4" y1="250" x2="0" y2="250" stroke="#94a3b8"/><text x="-8" y="254" text-anchor="end">0</text>
      <line x1="-4" y1="125" x2="0" y2="125" stroke="#94a3b8"/><text x="-8" y="129" text-anchor="end">500</text>
      <line x1="-4" y1="0"   x2="0" y2="0"   stroke="#94a3b8"/><text x="-8" y="10"  text-anchor="end">1000</text>
    </g>

    <!-- 293.3 449.7 600.0 460.4 634.4 779.8 927.1 814.5 -->
    <rect x="8"   y="176.7" width="20" height="73.3"  rx="2" fill="#f9a8d4"/>
    <rect x="43"  y="137.6" width="20" height="112.4" rx="2" fill="#f9a8d4"/>
    <rect x="78"  y="100.0" width="20" height="150.0" rx="2" fill="#f9a8d4"/>
    <rect x="113" y="134.9" width="20" height="115.1" rx="2" fill="#db2777"/>
    <rect x="148" y="91.4"  width="20" height="158.6" rx="2" fill="#f9a8d4"/>
    <rect x="183" y="55.1"  width="20" height="194.9" rx="2" fill="#f9a8d4"/>
    <rect x="218" y="18.2"  width="20" height="231.8" rx="2" fill="#f9a8d4"/>
    <rect x="253" y="46.4"  width="20" height="203.6" rx="2" fill="#f9a8d4"/>

    <g class="ax" text-anchor="middle">
      <text x="18"  y="266">1</text><text x="53"  y="266">2</text>
      <text x="88"  y="266">3</text><text x="123" y="266">4</text>
      <text x="158" y="266">5</text><text x="193" y="266">6</text>
      <text x="228" y="266">7</text><text x="263" y="266">8</text>
    </g>
    <text x="145" y="286" class="ax" text-anchor="middle">tokens in the pass</text>

    <!-- sawtooth annotation -->
    <path d="M 88 92 L 88 78 L 123 78 L 123 127" fill="none" stroke="#f59e0b" stroke-width="1.6"/>
    <polygon points="123,131 119,122 127,122" fill="#f59e0b"/>
    <text x="132" y="74" class="an" fill="#b45309">4 tokens cost LESS than 3</text>

    <text x="8" y="310" class="cap">Leftover tokens cost 1.8× an aligned</text>
    <text x="8" y="326" class="cap">one — the recurrent layers can't batch</text>
    <text x="8" y="342" class="cap">a partial chunk.</text>
  </g>

  <line x1="30" y1="410" x2="820" y2="410" stroke="#e2e8f0"/>
  <text x="30" y="430" class="cap">Practical rule: draft depth <tspan font-weight="600">n</tspan> makes a verify batch of <tspan font-weight="600">n+1</tspan>. Land it on a multiple of 4 — so n=3, or n=2 which is nearly as good and one draft cheaper.</text>
</svg>
