<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Image captioning with llama-server --mmproj</text>

  <rect x="20" y="90" width="120" height="90" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="80" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">Photo</text>
  <text x="80" y="150" text-anchor="middle" font-size="13" fill="#374151">JPEG, 640×480</text>

  <line x1="140" y1="135" x2="178" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="180" y="80" width="170" height="110" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="265" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">Vision encoder</text>
  <text x="265" y="134" text-anchor="middle" font-size="13" fill="#5b21b6">mmproj-F16.gguf</text>
  <text x="265" y="156" text-anchor="middle" font-size="13" fill="#5b21b6">(runs once per image)</text>

  <line x1="350" y1="135" x2="398" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="80" width="150" height="110" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="475" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Image tokens</text>
  <text x="475" y="134" text-anchor="middle" font-size="13" fill="#1e40af">≤ 256 (--image-</text>
  <text x="475" y="152" text-anchor="middle" font-size="13" fill="#1e40af">max-tokens 256)</text>
  <text x="475" y="175" text-anchor="middle" font-size="13" fill="#1e40af">+ text prompt</text>

  <line x1="550" y1="135" x2="598" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="600" y="80" width="140" height="110" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="670" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Language</text>
  <text x="670" y="132" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">model</text>
  <text x="670" y="156" text-anchor="middle" font-size="13" fill="#9a3412">Qwen3.5 / Gemma 4</text>

  <line x1="740" y1="135" x2="778" y2="135" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="780" y="90" width="100" height="90" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="830" y="130" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Caption</text>
  <text x="830" y="152" text-anchor="middle" font-size="13" fill="#065f46">text</text>

  <!-- timing brackets -->
  <g font-size="13" text-anchor="middle">
    <line x1="180" y1="215" x2="350" y2="215" stroke="#7c3aed" stroke-width="3"/>
    <text x="265" y="240" fill="#5b21b6" font-weight="bold">1. encode</text>
    <text x="265" y="258" fill="#5b21b6">vision encoder, CPU</text>
    <line x1="400" y1="215" x2="600" y2="215" stroke="#2563eb" stroke-width="3"/>
    <text x="500" y="240" fill="#1e40af" font-weight="bold">2. prompt processing</text>
    <text x="500" y="258" fill="#1e40af">image + text tokens (-tb)</text>
    <line x1="600" y1="215" x2="880" y2="215" stroke="#ea580c" stroke-width="3"/>
    <text x="740" y="240" fill="#9a3412" font-weight="bold">3. generation</text>
    <text x="740" y="258" fill="#9a3412">one token at a time (-t)</text>
  </g>
</svg>
