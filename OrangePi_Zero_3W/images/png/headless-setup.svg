<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Headless setup: from image file to SSH</text>

  <text x="140" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">ON THE COMPUTER</text>
  <text x="590" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">ON THE ORANGE PI (first boot)</text>
  <line x1="290" y1="56" x2="290" y2="280" stroke="#d1d5db" stroke-dasharray="5 4"/>

  <!-- Computer steps -->
  <rect x="30" y="85" width="220" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="113" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">1. Flash the image</text>
  <text x="140" y="135" text-anchor="middle" font-size="13" fill="#1e40af">balenaEtcher (verifies)</text>

  <rect x="30" y="185" width="220" height="80" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="140" y="212" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">2. Add Wi-Fi</text>
  <text x="140" y="233" text-anchor="middle" font-size="13" fill="#1e40af">NetworkManager keyfile</text>
  <text x="140" y="252" text-anchor="middle" font-size="13" fill="#1e40af">written to ext4 (debugfs)</text>
  <line x1="140" y1="155" x2="140" y2="183" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>

  <!-- Board steps -->
  <line x1="250" y1="225" x2="318" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="320" y="185" width="130" height="80" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="385" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#374151">3. Resize</text>
  <text x="385" y="235" text-anchor="middle" font-size="13" fill="#374151">root partition</text>
  <text x="385" y="253" text-anchor="middle" font-size="13" fill="#374151">to full card</text>

  <line x1="450" y1="225" x2="478" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="480" y="185" width="220" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="590" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">4. orangepi-firstrun</text>
  <text x="590" y="230" text-anchor="middle" font-size="13" fill="#9a3412">slow tasks (minutes), then</text>
  <text x="590" y="249" text-anchor="middle" font-size="13" fill="#9a3412">delete + regenerate SSH keys</text>

  <line x1="700" y1="225" x2="728" y2="225" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <rect x="730" y="185" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="800" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#065f46">5. Disables</text>
  <text x="800" y="235" text-anchor="middle" font-size="13" fill="#065f46">itself, SSH</text>
  <text x="800" y="253" text-anchor="middle" font-size="13" fill="#065f46">ready</text>

  <!-- Warning -->
  <rect x="320" y="295" width="550" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="595" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">Do not cut power during steps 3–5 (about 5 minutes)</text>
  <text x="595" y="344" text-anchor="middle" font-size="13" fill="#991b1b">Unplugging right after step 4 can leave 0-byte SSH host keys:</text>
  <text x="595" y="363" text-anchor="middle" font-size="13" fill="#991b1b">sshd will not start and every login ends in "Connection refused".</text>
  <line x1="590" y1="265" x2="590" y2="293" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
</svg>
