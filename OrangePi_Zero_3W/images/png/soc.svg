<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="Helvetica, Arial, sans-serif">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2937">Allwinner A733 on the Orange Pi Zero 3W</text>

  <!-- CPU complex -->
  <rect x="30" y="60" width="500" height="250" rx="10" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="46" y="84" font-size="14" font-weight="bold" fill="#374151">CPU (used by llama.cpp)</text>

  <rect x="50" y="100" width="210" height="190" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="155" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">Big cluster</text>
  <text x="155" y="143" text-anchor="middle" font-size="13" fill="#9a3412">2 × Cortex-A76 @ 2.0 GHz</text>
  <rect x="75" y="165" width="70" height="70" rx="6" fill="#fdba74" stroke="#ea580c"/>
  <text x="110" y="205" text-anchor="middle" font-size="14" fill="#7c2d12">CPU 6</text>
  <rect x="165" y="165" width="70" height="70" rx="6" fill="#fdba74" stroke="#ea580c"/>
  <text x="200" y="205" text-anchor="middle" font-size="14" fill="#7c2d12">CPU 7</text>
  <text x="155" y="270" text-anchor="middle" font-size="12" fill="#9a3412">fast: token generation</text>

  <rect x="280" y="100" width="230" height="190" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="395" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">Little cluster</text>
  <text x="395" y="143" text-anchor="middle" font-size="13" fill="#1e40af">6 × Cortex-A55 @ 1.8 GHz</text>
  <g font-size="13" fill="#1e3a8a" text-anchor="middle">
    <rect x="300" y="160" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="329" y="186">CPU 0</text>
    <rect x="366" y="160" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="395" y="186">CPU 1</text>
    <rect x="432" y="160" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="461" y="186">CPU 2</text>
    <rect x="300" y="210" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="329" y="236">CPU 3</text>
    <rect x="366" y="210" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="395" y="236">CPU 4</text>
    <rect x="432" y="210" width="58" height="42" rx="5" fill="#93c5fd" stroke="#2563eb"/><text x="461" y="236">CPU 5</text>
  </g>
  <text x="395" y="275" text-anchor="middle" font-size="12" fill="#1e40af">efficient: help with prompt processing</text>

  <!-- Accelerators -->
  <rect x="560" y="60" width="230" height="115" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="675" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b5563">GPU</text>
  <text x="675" y="110" text-anchor="middle" font-size="13" fill="#4b5563">PowerVR BXM-4-64 MC1</text>
  <text x="675" y="129" text-anchor="middle" font-size="13" fill="#4b5563">Vulkan 1.3 (proprietary driver)</text>
  <text x="675" y="155" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">not used by llama.cpp here (see text)</text>

  <rect x="560" y="195" width="230" height="115" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/>
  <text x="675" y="223" text-anchor="middle" font-size="15" font-weight="bold" fill="#4b5563">NPU</text>
  <text x="675" y="245" text-anchor="middle" font-size="13" fill="#4b5563">vendor SDK only</text>
  <text x="675" y="290" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">not supported by llama.cpp</text>

  <!-- Memory -->
  <line x1="280" y1="310" x2="280" y2="350" stroke="#374151" stroke-width="2"/>
  <line x1="675" y1="310" x2="675" y2="350" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <rect x="30" y="350" width="760" height="56" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="410" y="374" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">Shared LPDDR memory (5.7 GiB usable on our board)</text>
  <text x="410" y="395" text-anchor="middle" font-size="13" fill="#065f46">Token generation reads every weight once per token: memory bandwidth, not compute, sets the speed</text>
</svg>
